<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Ama, your assistant" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="circle"><circle cx="64" cy="64" r="64"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="128" height="128" fill="#1a8754"/>
    <circle cx="64" cy="64" r="52" fill="#22a066" opacity="0.35"/>

    <!-- hair (back volume) -->
    <circle cx="64" cy="50" r="31" fill="#1f1a17"/>
    <circle cx="40" cy="58" r="14" fill="#1f1a17"/>
    <circle cx="88" cy="58" r="14" fill="#1f1a17"/>

    <!-- shoulders / top -->
    <path d="M18 128c0-24 20-38 46-38s46 14 46 38z" fill="#f4f1ea"/>
    <path d="M52 92l12 12 12-12" fill="none" stroke="#d9d3c5" stroke-width="3" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M55 76h18v16c0 5-4 9-9 9s-9-4-9-9z" fill="#7a4a24"/>

    <!-- face -->
    <ellipse cx="64" cy="60" rx="21" ry="24" fill="#8d5a2b"/>
    <ellipse cx="43" cy="62" rx="4" ry="6" fill="#8d5a2b"/>
    <ellipse cx="85" cy="62" rx="4" ry="6" fill="#8d5a2b"/>

    <!-- hair fringe -->
    <path d="M42 54c0-17 10-27 22-27s22 10 22 27c-6-9-14-13-22-13s-16 4-22 13z" fill="#1f1a17"/>

    <!-- brows -->
    <path d="M51 53q5-3 10 0M67 53q5-3 10 0" fill="none" stroke="#1f1a17" stroke-width="2.4" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="56" cy="60" rx="2.8" ry="3.4" fill="#1f1a17"/>
    <ellipse cx="72" cy="60" rx="2.8" ry="3.4" fill="#1f1a17"/>
    <circle cx="57" cy="59" r="0.9" fill="#fff"/>
    <circle cx="73" cy="59" r="0.9" fill="#fff"/>
    <!-- cheeks -->
    <ellipse cx="51" cy="68" rx="3.5" ry="2" fill="#c0703f" opacity="0.55"/>
    <ellipse cx="77" cy="68" rx="3.5" ry="2" fill="#c0703f" opacity="0.55"/>
    <!-- nose + smile -->
    <path d="M64 63q-2 4 0 5" fill="none" stroke="#6e4220" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M56 72q8 7 16 0" fill="#fff" stroke="#5c2f16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- headset -->
    <path d="M40 60c0-20 11-32 24-32s24 12 24 32" fill="none" stroke="#2b2f36" stroke-width="4" stroke-linecap="round"/>
    <rect x="35" y="55" width="9" height="15" rx="4" fill="#2b2f36"/>
    <rect x="84" y="55" width="9" height="15" rx="4" fill="#2b2f36"/>
    <path d="M40 69q2 12 16 11" fill="none" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="57" cy="80" r="3" fill="#2b2f36"/>
